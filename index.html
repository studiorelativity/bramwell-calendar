<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + safe-area insets: the lens ratio must hold on notched phones. -->
    <!-- user-scalable=no: the scroller owns the touch gesture, so the browser's
         double-tap zoom would strand the page zoomed with no way back out. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#3056d3" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Bramwell Calendar</title>
    <style>
      /* The four category colors, defined once (conventions.md). */
      :root {
        --cat-work: #3056d3;
        --cat-personal: #17925a;
        --cat-financial: #d97706;
        --cat-other: #64748b;

        --surface: #ffffff;

        /* Alternating month bands, per day column. Weekend variants layer the
           weekend shade over each band so both stay readable. */
        --band-a: #ffffff;
        --band-b: #f5f4f1;
        --band-a-we: #efeeea;
        --band-b-we: #e7e5e0;
        --ink: #1c1917;
        --ink-muted: #78716c;
        --rule: #e7e5e4;

        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);

        color-scheme: light dark;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --surface: #0c0a09;
          --band-a: #0c0a09;
          --band-b: #15120f;
          --band-a-we: #1c1815;
          --band-b-we: #24201b;
          --ink: #fafaf9;
          --ink-muted: #a8a29e;
          --rule: #292524;
        }
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overscroll-behavior: none;
      }

      body {
        background: var(--surface);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

    </style>
  </head>
  <body>
    <header id="app-header">
      <div class="hrow">
        <div class="mlabel"></div>
        <button id="today-btn" class="hbtn" type="button">Today</button>
        <button id="signin-btn" class="hbtn" type="button" hidden>Sign in</button>
      </div>
      <div class="dow">
        <span>M</span><span>T</span><span>W</span><span>T</span>
        <span>F</span><span>S</span><span>S</span>
      </div>
    </header>
    <main id="calendar"></main>
    <aside id="drawer" hidden><!-- STAGE 04 --></aside>
    <!-- GIS loader. The script tag lives here so auth.ts stays DOM-free
         (stage 02 constraint); everything else about auth is in auth.ts. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
