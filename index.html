<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover + safe-area insets: the lens ratio must hold on notched phones. -->
    <!-- user-scalable=no: the scroller owns the touch gesture, so the browser's
         double-tap zoom would strand the page zoomed with no way back out. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c1917" />
    <!-- Both: iOS still reads the Apple one, which is otherwise deprecated. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Bramwell Calendar</title>
    <style>
      /* The four category colors, defined once (conventions.md).
         Values revised at stage 05 per the approved 05_polish/mock.html. */
      :root {
        --cat-work: #3056d3;
        --cat-personal: #17925a;
        --cat-financial: #d97706;
        --cat-other: #64748b;

        --surface: #faf9f7;

        /* Alternating month bands, per day column. Weekend variants layer the
           weekend shade over each band so both stay readable. */
        --band-a: #faf9f7;
        --band-b: #f0eeea;
        --band-a-we: #f2f0ec;
        --band-b-we: #e8e5df;
        --ink: #1c1917;
        --ink-muted: #8a837c;
        --ink-faint: #b3ada6;
        --rule: #e5e2dc;
        --rule-strong: #d6d2ca;
        --hover: rgba(28, 25, 23, 0.045);
        /* Today's own colour — the ONE hue outside the four categories, and
           the only thing it is ever used for. Red-for-today is the convention
           every desktop calendar already teaches, so it reads as "now" rather
           than as a fifth category or an error. Channels too, for the wash. */
        --today: #e11d48;
        --today-rgb: 225, 29, 72;

        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);

        color-scheme: light dark;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          /* Lifted warm graphite, never near black: the band contrast must
             survive a phone at arm's length (spec, Visual direction). */
          --surface: #151210;
          --band-a: #151210;
          --band-b: #211d18;
          --band-a-we: #1c1815;
          --band-b-we: #29241e;
          --ink: #f3f1ee;
          --ink-muted: #a49d94;
          --ink-faint: #6e685f;
          --rule: #2e2924;
          --rule-strong: #3a342c;
          --hover: rgba(243, 241, 238, 0.05);
          /* Lifted for the dark ground, same as the category hues below. */
          --today: #fb7185;
          --today-rgb: 251, 113, 133;

          /* Brightened category variants: the light-mode hues fail contrast
             on tinted dark fills. */
          --cat-work: #7b96ff;
          --cat-personal: #4fc48d;
          --cat-financial: #f0a13c;
          --cat-other: #94a3b8;
        }
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overscroll-behavior: none;
      }

      body {
        background: var(--surface);
        color: var(--ink);
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      }

    </style>
  </head>
  <body>
    <header id="app-header">
      <div class="hrow">
        <div class="mlabel"></div>
        <div class="yearnav" hidden>
          <button id="year-prev" class="hbtn" type="button" aria-label="Previous year">‹</button>
          <button id="year-next" class="hbtn" type="button" aria-label="Next year">›</button>
        </div>
        <div class="views" role="group" aria-label="View">
          <button class="view" type="button" data-view="calendar" aria-pressed="true">Cal</button>
          <button class="view" type="button" data-view="year" aria-pressed="false">Year</button>
        </div>
        <!-- Stage 05: the 15/30/45 selector moved into Settings; the sign-in
             button was replaced by the first-run screen + this reconnect pill
             (shown only when auth is stale over a warm cache). -->
        <meta name="google-site-verification" content="NRdtxt-mywp-yb8TGIko_83gO6NVnXgVGzx4WfwLdpU" />
        <button id="today-btn" class="hbtn" type="button">Today</button>
        <span id="offline-pill" class="hbtn offline" hidden>Offline</span>
        <button id="reconnect-pill" class="hbtn reconnect" type="button" hidden>Reconnect</button>
        <button id="avatar-btn" class="avatar" type="button" aria-label="Account and settings" hidden>
          <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" fill="currentColor">
            <path d="M12 12a4.5 4.5 0 1 0 0-9 4.5 4.5 0 0 0 0 9Zm0 2c-4 0-7.5 2.1-7.5 4.9V21h15v-2.1c0-2.8-3.5-4.9-7.5-4.9Z"/>
          </svg>
          <span class="dot" aria-hidden="true"></span>
        </button>
      </div>
      <div class="dow">
        <span>M</span><span>T</span><span>W</span><span>T</span>
        <span>F</span><span>S</span><span>S</span>
      </div>
    </header>
    <main id="calendar"></main>
    <section id="year" hidden></section>
    <aside id="drawer" aria-label="Day details" hidden></aside>
    <!-- GIS loader. The script tag lives here so auth.ts stays DOM-free
         (stage 02 constraint); everything else about auth is in auth.ts. -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
